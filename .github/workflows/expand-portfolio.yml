name: Expand verified portfolio release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/expand-portfolio.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and expand the portfolio archive
        shell: bash
        run: |
          set -euo pipefail
          archive=Weston-Zloty-BI-Portfolio.zip
          echo 'fb6a3b057aca00111b3d4a2b2b116430138309282d068829bfd144b7438e176d  Weston-Zloty-BI-Portfolio.zip' | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/verified-portfolio"
          source="$RUNNER_TEMP/verified-portfolio/bi-portfolio"
          cp -a "$source"/. .
          git add .gitignore README.md INTERVIEW.md build.py requirements.txt docs power-bi profile projects src
          git rm -- "$archive"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish four reproducible business intelligence projects'
          git push origin HEAD:main
